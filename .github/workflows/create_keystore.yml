name: Create signing keystore

# 一次性工作流：生成固定的签名密钥库并上传 artifact。
# 之后把 artifact 里的内容配置到仓库 Secrets：
#   SIGN_KEYSTORE_BASE64 = key.jks.b64 的内容
#   KEYSTORE_PASSWORD    = 生成时使用的密码
#   KEY_ALIAS            = piliplus
#   KEY_PASSWORD         = 同 KEYSTORE_PASSWORD
# 配置好后删除本工作流或不再触发即可。

on:
    workflow_dispatch:

jobs:
    keystore:
        runs-on: ubuntu-latest
        steps:
            - name: 安装 JDK
              uses: actions/setup-java@v5
              with:
                  distribution: zulu
                  java-version: "17"

            - name: 生成密钥库
              env:
                  STORE_PASS: PiliPlus$2024sign
              run: |
                  keytool -genkeypair -v \
                    -keystore key.jks \
                    -alias piliplus \
                    -keyalg RSA -keysize 2048 -validity 36500 \
                    -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
                    -dname "CN=PiliPlus, OU=PiliPlus, O=PiliPlus, L=Internet, ST=Internet, C=CN"
                  base64 -w0 key.jks > key.jks.b64
                  {
                    echo "KEYSTORE_PASSWORD / KEY_PASSWORD: $STORE_PASS"
                    echo "KEY_ALIAS: piliplus"
                    echo "SIGN_KEYSTORE_BASE64: 见 key.jks.b64 文件内容（一行 base64）"
                  } | tee 密码说明.txt

            - name: 上传
              uses: actions/upload-artifact@v4
              with:
                  name: keystore
                  path: |
                      key.jks
                      key.jks.b64
                      密码说明.txt
                  if-no-files-found: error
