name: Flutter check

# 分支 push / PR 的编译检查: analyze + debug apk(arm64)。
# main 分支的 push 由 weekly_unlock_release 构建覆盖, 不重复检查。
on:
    push:
        branches-ignore:
            - main
        paths-ignore:
            - "**.md"
    pull_request:
        paths-ignore:
            - "**.md"
    workflow_dispatch:

jobs:
    check:
        name: Analyze & Build Android
        runs-on: ubuntu-latest
        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Flutter Analyze
              run: flutter analyze --no-pub

            - name: Flutter Build Debug Apk
              run: flutter build apk --debug --target-platform android-arm64 --no-pub
